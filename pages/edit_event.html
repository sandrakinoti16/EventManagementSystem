<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Event</title>

    <link rel="stylesheet"
          href="../assets/css/events.css">

    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
    rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest" defer></script>
<script src="../dashboard.js" defer></script>
<link rel="stylesheet" href="../dashboard.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<header class="ems-header">
    <div class="header-left">
      <!-- Logo Block -->
      <a href="../dashboard.html" class="ems-logo-area" aria-label="Event Management System Home">
        <div class="logo-badge">EMS</div>
        <span class="logo-text">Event Management System</span>
      </a>
      
      <!-- Nav Tabs -->
      <nav class="nav-links" aria-label="Main Navigation">
    <a href="../dashboard.html" class="nav-item">Dashboard</a>
    <a href="../reports.html" class="nav-item">Reports</a>
    <a href="events.html" class="nav-item">Events</a>
    <a href="registration.html" class="nav-item">Registrations</a>
    <a href="ticket.html" class="nav-item">Tickets</a>
</nav>
    </div>

    <!-- Search in Header -->
    <div class="header-search">
      <i class="search-icon" data-lucide="search" aria-hidden="true"></i>
      <input type="text" id="global-search-input" placeholder="Search events, participants, reports..." aria-label="Global Search">
    </div>

    <!-- Right Side Actions & Menu -->
    <div class="header-right">
      <!-- Notifications Toggle -->
      <div class="dropdown-container">
        <button class="icon-button" id="notiDropdownTrigger" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
          <i data-lucide="bell"></i>
          <span class="notification-badge"></span>
        </button>
        <!-- Dropdown Notifications Menu -->
        <div class="notifications-dropdown" id="notiDropdownMenu" role="menu">
          <div class="noti-header">
            <h3>Notifications</h3>
            <button aria-label="Mark all notifications as read">Mark all as read</button>
          </div>
          <div class="noti-list" id="notifications-list">
            <!-- Dynamically populated from JS -->
          </div>
        </div>
      </div>

      <!-- User Profile Toggle -->
      <div class="dropdown-container">
        <button class="avatar-wrapper" id="avatarDropdownTrigger" aria-label="User profile menu" aria-haspopup="true" aria-expanded="false">
          <div class="avatar" id="user-avatar">U</div>
        </button>
        <!-- Dropdown menu -->
        <div class="dropdown-menu" id="profileDropdownMenu" role="menu">
          <div class="dropdown-header">
            <div class="dropdown-user-name" id="logged-user-name">User</div>
            <div class="dropdown-user-email" id="logged-user-email">user@email.com</div>
          </div>
          <a href="#" class="dropdown-item" role="menuitem"><i data-lucide="user" style="width: 16px; height: 16px;"></i> My Profile</a>
          <a href="#" class="dropdown-item" role="menuitem"><i data-lucide="settings" style="width: 16px; height: 16px;"></i> Settings</a>
          <a href="../reports.html" class="dropdown-item" role="menuitem"><i data-lucide="bar-chart-2" style="width: 16px; height: 16px;"></i> Analytics Reports</a>
          <a href="#" id="logoutBtn" class="dropdown-item logout" role="menuitem">
    <i data-lucide="log-out" style="width: 16px; height: 16px;"></i>
    Sign Out
</a>
        </div>
      </div>
    </div>
  </header>

<!-- ================= PAGE ================= -->

<main class="container">

<div class="form-card">

<h1>Edit Event</h1>

<p>
<p>
Update the details of your event below.
</p>
</p>

<form id="editEventForm">

<div class="form-grid">

<div class="form-group">

<label>Event Name</label>

<input
type="text"
id="eventName"
placeholder="Enter event name"
required>

</div>

<div class="form-group">

<label>Category</label>

<select id="category">

<option>Conference</option>

<option>Workshop</option>

<option>Seminar</option>

<option>Sports</option>

<option>Concert</option>

</select>

</div>

<div class="form-group">

<label>Venue</label>

<input
type="text"
id="venue"
placeholder="Enter venue">

</div>

<div class="form-group">

<label>Organizer</label>

<input
type="text"
id="organizer"
placeholder="Organizer name">

</div>

<div class="form-group">

<label>Start Date</label>

<input
type="date"
id="startDate">

</div>

<div class="form-group">

<label>End Date</label>

<input
type="date"
id="endDate">

</div>

<div class="form-group">

<label>Capacity</label>

<input
type="number"
id="capacity"
placeholder="0">

</div>

<div class="form-group">

<label>Ticket Price</label>

<input
type="number"
id="ticketPrice"
placeholder="0">

</div>

<div class="form-group full-width">

<label>Description</label>

<textarea
id="description"
rows="5"
placeholder="Write event description..."></textarea>

</div>

<div class="form-group full-width">

<label>Upload Event Image</label>

<input
type="file"
id="image">

</div>

</div>

<div class="button-group">

<a href="events.html"
class="secondary-btn">

Cancel

</a>

<button
type="submit"
class="primary-btn">

<i class="ri-save-line"></i>

Update Event

</button>

</div>

</form>

</div>

</main>

<script src="../assets/js/events.js"></script>

</body>

</html>
